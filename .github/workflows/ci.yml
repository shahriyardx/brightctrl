name: ci

# Compile check on Linux and Windows for pushes and PRs. Proves the Windows
# backend (dxva2 / ddc-winapi + registry EDID) builds without needing a release.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Upload Windows exe
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: brightctrl-windows-x64
          path: target/release/brightctrl.exe
