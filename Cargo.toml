[package]
name = "brightctrl"
version = "0.1.3"
edition = "2021"
description = "Lightweight DDC/CI external monitor brightness controller for Linux"
license = "MIT"
repository = "https://github.com/shahriyardx/brightctrl"
homepage = "https://github.com/shahriyardx/brightctrl"
keywords = ["brightness", "ddc-ci", "monitor", "tui", "ratatui"]
categories = ["command-line-utilities"]

[[bin]]
name = "brightctrl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
ddc = "0.2"
ddc-i2c = { version = "0.2.2", features = ["i2c-linux"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
